<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hometeam Statpad</title>
  <style>
    :root {
      --primary: #004C54;
      --silver: #A5ACAF;
      --bg: #1a1a1a;
      --bg2: #252525;
      --bg3: #2f2f2f;
      --white: #ffffff;
      --gold: #c8a800;
      --success-bg: #1c2e1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--white); font-family: Arial, sans-serif; min-height: 100vh; }

    header {
      background: var(--primary);
      padding: 14px 24px;
      border-bottom: 2px solid var(--silver);
    }
    .header-inner {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; }
    .logo span { color: var(--silver); }

    .team-picker-btn {
      background: rgba(0, 0, 0, 0.25);
      color: var(--white);
      border: 1px solid var(--silver);
      border-radius: 20px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      line-height: 1;
    }
    .team-picker-btn:hover { background: rgba(0, 0, 0, 0.4); }
    .tp-label { color: var(--silver); font-size: 9px; }
    .tp-team { color: var(--white); }
    .tp-caret { color: var(--silver); font-size: 10px; }

    /* Team picker modal body */
    .sport-group { margin-top: 16px; }
    .sport-group:first-child { margin-top: 8px; }
    .sport-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--silver);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .team-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--bg3);
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: var(--white);
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .team-option:hover:not(:disabled) { background: #3a3a3a; border-color: var(--silver); }
    .team-option:disabled { opacity: 0.4; cursor: not-allowed; }
    .team-option.active { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 30%, var(--bg2)); }
    .team-option-name { display: flex; flex-direction: column; gap: 2px; }
    .team-option-sub { font-size: 10px; font-weight: 500; color: var(--silver); letter-spacing: 1px; text-transform: uppercase; }
    .team-option-status {
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--silver);
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 7px;
      border-radius: 3px;
    }
    .team-option.active .team-option-status { color: var(--white); background: var(--primary); }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      padding: 20px 16px;
      max-width: 700px;
      margin: 0 auto;
    }
    .score-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .score-label { font-size: 10px; letter-spacing: 2px; color: var(--silver); text-transform: uppercase; }
    .score-value { font-size: 38px; font-weight: 900; line-height: 1; }
    .category-value { font-size: 20px; margin-top: 6px; }

    .date-bar {
      max-width: 700px;
      margin: 0 auto 12px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .date-bar-label { font-size: 11px; color: var(--silver); letter-spacing: 1px; text-transform: uppercase; }
    input.date-picker {
      background: var(--bg3);
      color: var(--white);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      color-scheme: dark;
    }
    input.date-picker:focus { outline: none; border-color: var(--primary); }

    .completion-banner {
      max-width: 700px;
      margin: 0 auto 16px;
      padding: 18px 16px;
      background: var(--primary);
      border: 1px solid var(--silver);
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .banner-title { font-size: 11px; letter-spacing: 3px; color: var(--silver); font-weight: 700; }
    .banner-score { font-size: 44px; font-weight: 900; color: var(--white); line-height: 1; margin-top: 6px; }
    .banner-label { font-size: 10px; letter-spacing: 2px; color: var(--silver); margin-top: 4px; }
    .banner-msg { font-size: 12px; color: var(--white); margin-top: 10px; opacity: 0.85; }

    .board {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Row card: outer container holds the constraint strip + an expand area
       for the input form or result block. Slabs sit inside row-constraints. */
    .row {
      background: var(--bg2);
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row.completed {
      background: var(--success-bg);
      border-color: color-mix(in srgb, #4caf50 30%, var(--bg2));
    }

    .row-constraints {
      display: grid;
      grid-template-columns: minmax(120px, 1.1fr) minmax(96px, 1fr) auto;
      gap: 6px;
    }
    .row-constraints.has-filter {
      grid-template-columns: minmax(120px, 1.1fr) minmax(96px, 1fr) minmax(110px, 1fr) auto;
    }

    .slab {
      background: var(--bg3);
      border-radius: 6px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 96px;
      gap: 4px;
    }
    .slab-time {
      background: color-mix(in srgb, var(--primary) 30%, var(--bg3));
      border: 1px solid color-mix(in srgb, var(--primary) 55%, transparent);
    }

    .slab-caption {
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--silver);
      text-transform: uppercase;
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 2px;
    }
    .slab-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: 0.3px;
      line-height: 1.15;
    }
    .slab-value.compact { font-size: 16px; }

    .year-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      gap: 2px;
    }
    .year-stack .yr {
      font-size: 22px;
      font-weight: 800;
      color: var(--white);
    }
    .year-stack .conj {
      font-size: 11px;
      color: var(--silver);
      font-weight: 600;
    }

    .era-flavor {
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 700;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 3px;
    }

    .mode-tag {
      margin-top: 4px;
      font-size: 8px;
      letter-spacing: 1.2px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 3px;
      text-transform: uppercase;
      background: var(--gold);
      color: #000;
      line-height: 1.2;
    }

    /* The expand area holds the input form (when open) or the result block
       (when submitted). Hidden when empty so the row sits compact. */
    .row-expand { padding: 8px 4px 4px; }
    .row-expand:empty { display: none; }

    .add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      min-height: 96px;
      min-width: 120px;
    }
    .add-btn:hover { filter: brightness(1.15); }

    .input-form { display: none; flex-direction: column; gap: 8px; width: 100%; }
    .input-form.open { display: flex; }

    .input-row { display: flex; gap: 8px; align-items: flex-start; }
    .input-wrap { position: relative; flex: 1; }

    input.player-input {
      width: 100%;
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      padding: 9px 12px;
      font-size: 13px;
    }
    input.player-input:focus { outline: none; border-color: var(--primary); }

    select.year-select {
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      padding: 9px 8px;
      font-size: 13px;
      width: 85px;
    }
    select.year-select:focus { outline: none; border-color: var(--primary); }

    .go-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #2a2a2a;
      border: 1px solid #444;
      border-top: none;
      border-radius: 0 0 6px 6px;
      z-index: 20;
      max-height: 160px;
      overflow-y: auto;
    }
    .suggestion-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .suggestion-item:hover { background: #3a3a3a; }
    .suggestion-name { color: var(--white); }
    .suggestion-years { color: var(--silver); font-size: 11px; white-space: nowrap; }

    .error-msg { color: #ff6b6b; font-size: 12px; line-height: 1.4; }

    .result-block { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .result-summary { display: flex; justify-content: space-between; align-items: flex-start; }
    .result-name { font-size: 15px; font-weight: 700; }
    .result-year-label { font-size: 11px; color: var(--silver); }
    .result-pct { font-size: 10px; color: var(--silver); margin-top: 3px; }
    .result-stat-block { text-align: right; }
    .result-stat { font-size: 30px; font-weight: 900; color: #4caf50; line-height: 1; }
    .result-stat-label { font-size: 10px; color: #aaa; text-align: right; }

    .leaderboard { border-top: 1px solid #333; padding-top: 8px; }
    .lb-header { font-size: 9px; letter-spacing: 2px; color: var(--silver); text-transform: uppercase; margin-bottom: 5px; }
    .lb-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; color: #bbb; }
    .lb-row-highlight { color: #4caf50; font-weight: 700; }
    .lb-rank { width: 14px; color: #666; font-size: 11px; }
    .lb-name { flex: 1; }
    .lb-year { width: 64px; color: #777; font-size: 11px; }
    .lb-val { width: 40px; text-align: right; font-weight: 700; }

    .footer {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 16px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .how-btn {
      background: var(--bg3);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .credit { font-size: 11px; color: var(--silver); letter-spacing: 0.5px; }
    .credit a { color: var(--silver); text-decoration: underline; }
    .credit a:hover { color: var(--white); }

    .footer-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }

    .modal-card {
      background: var(--bg2);
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 22px;
      width: 100%;
      max-width: 460px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--silver);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
    }
    .modal-close:hover { color: var(--white); }

    .modal-title { font-size: 18px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: var(--silver); margin-bottom: 16px; line-height: 1.4; }

    .field-label {
      display: block;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--silver);
      text-transform: uppercase;
      margin: 12px 0 6px;
    }
    .modal-card textarea,
    .modal-card input[type="email"] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid #444;
      border-radius: 6px;
      color: var(--white);
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }
    .modal-card textarea:focus,
    .modal-card input[type="email"]:focus { outline: none; border-color: var(--primary); }
    .modal-card textarea { min-height: 110px; }
    .honeypot { display: none !important; }

    .modal-actions { margin-top: 18px; display: flex; justify-content: flex-end; }
    .submit-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .submit-btn:hover { filter: brightness(1.15); }
    .submit-btn:disabled { background: #444; cursor: not-allowed; }

    .modal-status { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .modal-status.success { color: #4caf50; }
    .modal-status.error { color: #ff6b6b; }

    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      .logo { font-size: 17px; letter-spacing: 1.5px; }

      .scoreboard { padding: 14px 12px; gap: 6px; }
      .score-value { font-size: 26px; }
      .category-value { font-size: 15px; word-break: break-word; }
      .score-label { font-size: 9px; letter-spacing: 1px; }

      .date-bar { padding: 0 12px; }

      .board { padding: 0 12px 32px; }

      .row-constraints {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "time pos"
          "action action";
      }
      .row-constraints.has-filter {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "time pos"
          "filter filter"
          "action action";
      }
      .slab-time { grid-area: time; }
      .slab-position { grid-area: pos; }
      .slab-filter { grid-area: filter; }
      .add-btn {
        grid-area: action;
        min-height: 48px;
        min-width: 0;
        width: 100%;
      }
      .row-expand { padding: 6px 4px 2px; }

      .input-row { flex-wrap: wrap; }
      .input-wrap { flex: 1 1 100%; }
      select.year-select { flex: 1 1 auto; width: auto; }
      .go-btn { flex: 0 0 auto; }

      .completion-banner { padding: 16px 14px; }
      .banner-score { font-size: 36px; }

      .result-stat { font-size: 26px; }
      .result-name { font-size: 14px; }

      .footer { padding: 0 12px 28px; }

      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal-card {
        max-width: 100%;
        max-height: 92vh;
        border-radius: 14px 14px 0 0;
        padding: 20px 18px 24px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">HOMETEAM <span>STATPAD</span></div>
    <button class="team-picker-btn" id="team-picker-btn" onclick="openTeamPicker()">
      <span class="tp-label">Playing</span>
      <span class="tp-team" id="tp-team-label">--</span>
      <span class="tp-caret">▾</span>
    </button>
  </div>
</header>

<div class="scoreboard">
  <div class="score-block">
    <div class="score-value category-value" id="display-category">--</div>
    <div class="score-label">CATEGORY</div>
  </div>
  <div class="score-block">
    <div class="score-value" id="display-score">0</div>
    <div class="score-label">TOTAL SCORE</div>
  </div>
  <div class="score-block">
    <div class="score-value" id="display-guesses">0</div>
    <div class="score-label">TOTAL GUESSES</div>
  </div>
</div>

<div class="date-bar">
  <span class="date-bar-label">Date:</span>
  <input type="date" class="date-picker" id="date-picker" onchange="onDateChange(this.value)" />
</div>

<div class="completion-banner" id="completion-banner"></div>

<div class="board" id="board"></div>

<div class="footer">
  <div class="footer-actions">
    <button class="how-btn" onclick="showHelp()">? HOW TO PLAY</button>
    <button class="how-btn" onclick="openFeedback()">SEND FEEDBACK</button>
  </div>
  <div class="credit">Inspired by <a href="https://www.statpadgame.com/" target="_blank" rel="noopener">StatPad</a></div>
</div>

<div class="modal-overlay" id="team-picker-modal" aria-hidden="true" onclick="onTeamPickerOverlayClick(event)">
  <div class="modal-card" role="dialog" aria-labelledby="team-picker-title" aria-modal="true">
    <button class="modal-close" onclick="closeTeamPicker()" aria-label="Close">&times;</button>
    <div class="modal-title" id="team-picker-title">CHOOSE YOUR TEAM</div>
    <div class="modal-sub">Pick a home team. We'll remember it for next time. More teams and city bundles coming soon.</div>
    <div id="team-picker-body"></div>
  </div>
</div>

<div class="modal-overlay" id="feedback-modal" aria-hidden="true" onclick="onOverlayClick(event)">
  <div class="modal-card" role="dialog" aria-labelledby="feedback-title" aria-modal="true">
    <button class="modal-close" onclick="closeFeedback()" aria-label="Close">&times;</button>
    <div class="modal-title" id="feedback-title">SEND FEEDBACK</div>
    <div class="modal-sub">Bug, idea, or just letting me know what you think. It all comes straight to me.</div>
    <form id="feedback-form" onsubmit="submitFeedback(event)">
      <label class="field-label" for="fb-message">Your message</label>
      <textarea id="fb-message" name="message" required placeholder="What's on your mind?"></textarea>
      <label class="field-label" for="fb-email">Your email (optional)</label>
      <input type="email" id="fb-email" name="reply_email" placeholder="Only if you want a reply">
      <input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off">
      <input type="hidden" name="_subject" value="Hometeam Statpad feedback">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <div class="modal-actions">
        <button type="submit" class="submit-btn" id="fb-submit">Send</button>
      </div>
      <div class="modal-status" id="fb-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
